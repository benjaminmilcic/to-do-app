# Builds the signed Android APK on a GitHub-hosted runner and publishes it at
# https://todo-app.benjamin-milcic.dev/downloads/todo-app.apk
#
# Specific to benjamin-milcic.dev - adapt or delete this workflow when you host
# the app yourself.
#
# The runner image ships the Android SDK; JDK and Node.js are set up below.
# The release keystore comes from a secret, so no local machine is involved.
#
# Required secrets:
#   DEPLOY_SSH_KEY             private key of the `deploy` user
#   ANDROID_KEYSTORE_BASE64    the release keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  password of the release keystore
#   ANDROID_KEY_PASSWORD       password of the signing key
# Required variable (Settings -> Variables):
#   ANDROID_KEY_ALIAS          alias of the signing key
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  DEPLOY_HOST: 212.227.31.144
  DEPLOY_USER: deploy
  # SHA256:BlrTpwjVYl8eVYCc42TiVZ8b6+CfkDdSXHJY1Lb2+Sw
  DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJochYl1GIdPP5/AI52kDXBFd5d3ludjEotSaOhqtLXO
  DOWNLOAD_DIR: /var/www/todo-app/downloads
  APK_URL: https://todo-app.benjamin-milcic.dev/downloads/todo-app.apk

defaults:
  run:
    working-directory: frontend

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same major version as the JDK bundled with Android Studio.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            frontend/android/*.gradle*
            frontend/android/**/gradle-wrapper.properties

      - name: Install
        run: npm ci

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1
          fi
          # Strip line breaks/whitespace that tools (e.g. Windows PowerShell)
          # may add when the secret is set.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:apk

      # Fails the run if the APK is unsigned or signed with another key.
      - name: Check signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs dist-apk/todo-app.apk | tee signature.txt
          grep -q "CN=Benjamin Milcic" signature.txt

      - name: Upload to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key instead of trusting whatever ssh-keyscan returns.
          echo "$DEPLOY_HOST $DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          target="$DEPLOY_USER@$DEPLOY_HOST"

          # Upload under a temporary name and rename, so a download never
          # gets a half-written file.
          scp -q dist-apk/todo-app.apk "$target:$DOWNLOAD_DIR/todo-app.apk.tmp"
          ssh "$target" "chmod 644 $DOWNLOAD_DIR/todo-app.apk.tmp && mv -f $DOWNLOAD_DIR/todo-app.apk.tmp $DOWNLOAD_DIR/todo-app.apk"

      - name: Verify
        run: |
          size=$(stat -c %s dist-apk/todo-app.apk)
          live=$(curl -sI --max-time 20 "$APK_URL?r=$GITHUB_RUN_ID" | tr -d '\r' | awk 'tolower($1)=="content-length:" {print $2}')
          echo "local=$size live=$live"
          [ "$size" = "$live" ] || { echo "Download does not serve the new APK"; exit 1; }

      - name: Remove secrets from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" ~/.ssh/id_ed25519
