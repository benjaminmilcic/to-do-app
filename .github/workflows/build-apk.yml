# Builds the Android APK on a self-hosted Windows runner with Android Studio
# and publishes it at https://todo-app.benjamin-milcic.dev/downloads/todo-app.apk
#
# Specific to benjamin-milcic.dev - adapt or delete this workflow when you host
# the app yourself. Without a self-hosted runner it simply stays queued.
#
# Runner: self-hosted, Windows, with Android Studio (JDK under
#   C:\Program Files\Android\Android Studio\jbr), the Android SDK, Node.js 24
#   and the Windows OpenSSH client (ssh, scp). Registered with the extra label
#   `android`.
#
# Required secrets:
#   DEPLOY_SSH_KEY             private key of the `deploy` user
#   ANDROID_KEYSTORE_PASSWORD  password of the release keystore
#   ANDROID_KEY_PASSWORD       password of the signing key
# Required variables (Settings -> Variables):
#   ANDROID_KEYSTORE_FILE      absolute path of the keystore on the runner
#   ANDROID_KEY_ALIAS          alias of the signing key
#
# Security: this workflow only runs for pushes to main and manual starts -
# never for pull requests - so code from forks never reaches the runner.
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  DEPLOY_HOST: 212.227.31.144
  DEPLOY_USER: deploy
  DOWNLOAD_DIR: /var/www/todo-app/downloads
  APK_URL: https://todo-app.benjamin-milcic.dev/downloads/todo-app.apk

jobs:
  apk:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, windows, android]
    # Windows PowerShell is always present. `bash` is not reliable on Windows:
    # depending on PATH it resolves to WSL instead of Git Bash.
    defaults:
      run:
        shell: powershell
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ vars.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_FILE -or -not (Test-Path $env:ANDROID_KEYSTORE_FILE)) {
            Write-Error "Keystore not found - set the ANDROID_KEYSTORE_FILE variable"; exit 1
          }
          npm run android:apk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # Windows PowerShell treats any stderr output of native tools as an
          # error; rely on exit codes instead.
          $ErrorActionPreference = 'Continue'
          $key = Join-Path $env:RUNNER_TEMP 'deploy_key'
          $known = Join-Path $env:RUNNER_TEMP 'known_hosts'
          [IO.File]::WriteAllText($key, $env:SSH_KEY.Trim() + "`n")
          # OpenSSH for Windows refuses keys that other accounts can read.
          icacls $key /inheritance:r /grant:r "${env:USERNAME}:R" | Out-Null
          cmd /c "ssh-keyscan -H $env:DEPLOY_HOST 2>nul" | Set-Content -Encoding ascii $known
          if (-not (Get-Content $known)) { Write-Error 'ssh-keyscan returned no host key'; exit 1 }
          $opts = @('-q', '-i', $key, '-o', "UserKnownHostsFile=$known", '-o', 'StrictHostKeyChecking=yes', '-o', 'LogLevel=ERROR')
          $target = "$env:DEPLOY_USER@$env:DEPLOY_HOST"

          # Upload under a temporary name and rename, so a download never
          # gets a half-written file.
          scp @opts dist-apk/todo-app.apk "${target}:$env:DOWNLOAD_DIR/todo-app.apk.tmp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ssh @opts $target "chmod 644 $env:DOWNLOAD_DIR/todo-app.apk.tmp && mv -f $env:DOWNLOAD_DIR/todo-app.apk.tmp $env:DOWNLOAD_DIR/todo-app.apk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify
        run: |
          $size = (Get-Item dist-apk/todo-app.apk).Length
          $response = Invoke-WebRequest -UseBasicParsing -Method Head -TimeoutSec 20 "$($env:APK_URL)?r=$($env:GITHUB_RUN_ID)"
          $live = [long]$response.Headers['Content-Length']
          Write-Host "local=$size live=$live"
          if ($size -ne $live) { Write-Error 'Download does not serve the new APK'; exit 1 }

      - name: Remove key
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'deploy_key'), (Join-Path $env:RUNNER_TEMP 'known_hosts')
