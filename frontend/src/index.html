<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>ToDo</title>

    <base href="/" />

    <meta name="description" content="Deine Aufgaben auf allen Geräten, sofort synchronisiert." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f2fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0e17" />
    <!-- No viewport-fit=cover: with it, Capacitor 8 on Android WebView >= 140
         draws the app under the system bars and the scrolled list runs under
         the navigation bar. Without it, Capacitor keeps the app between the
         bars on every WebView version. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/svg+xml" href="assets/icon/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ToDo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Apply the saved appearance before the app starts, so dark mode does
         not flash light first. Same logic and key as ThemeService. -->
    <script>
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('todo.theme') || 'system';
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('ion-palette-dark');
      })();
    </script>
  </head>

  <body>
    <app-root></app-root>
    <noscript>Diese App benötigt JavaScript.</noscript>
  </body>
</html>
