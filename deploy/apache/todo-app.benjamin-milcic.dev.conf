# Apache vHost for the ToDo app.
#
# Install as /etc/apache2/sites-available/todo-app.benjamin-milcic.dev.conf
# Requires Apache >= 2.4.47 (ProxyPass upgrade=websocket) and mod_ssl,
# mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite, mod_headers.
#
# Specific to benjamin-milcic.dev: TLS uses the Cloudflare origin certificate,
# and the security-headers snippet, the cf_combined log format and the global
# mod_remoteip config (CF-Connecting-IP) are defined elsewhere on that server.
# Replace these when you host the app yourself.

<VirtualHost *:80>
    ServerName todo-app.benjamin-milcic.dev
    Redirect permanent / https://todo-app.benjamin-milcic.dev/
</VirtualHost>

<VirtualHost *:443>
    ServerName todo-app.benjamin-milcic.dev

    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/origin.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/origin.key

    Include /etc/apache2/snippets/security-headers.conf

    DocumentRoot /var/www/todo-app/frontend

    ErrorLog  ${APACHE_LOG_DIR}/todo-app.error.log
    CustomLog ${APACHE_LOG_DIR}/todo-app.access.log cf_combined

    # --- API + Socket.IO (WebSocket) -> NestJS on loopback ------------------
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60
    # Keep the API's JSON error bodies instead of Apache error pages.
    ProxyErrorOverride Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        /api/ http://127.0.0.1:3100/api/ timeout=60 upgrade=websocket
    ProxyPassReverse /api/ http://127.0.0.1:3100/api/

    # --- APK downloads -------------------------------------------------------
    Alias /downloads /var/www/todo-app/downloads
    <Directory /var/www/todo-app/downloads>
        Options -Indexes
        AllowOverride None
        Require all granted
        AddType application/vnd.android.package-archive .apk
        Header set Content-Disposition "attachment"
        Header set Cache-Control "no-cache"
    </Directory>

    # --- Static Angular/Ionic PWA ---------------------------------------------
    <Directory /var/www/todo-app/frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # SPA fallback for client-side routes (/login, /auth/callback, ...).
    # Only extension-less paths that are no file: a missing bundle must stay a
    # 404 instead of being answered with index.html. API and downloads are
    # excluded because rewriting runs before the proxy.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/downloads/
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]{1,12}$
    RewriteRule ^ /index.html [L]

    # Caching (matched on the delivered file, not the URL). Short in the
    # browser, long at the Cloudflare edge, which the deploy purges.
    # Order matters: the no-cache block MUST stay last - it is what keeps the
    # unhashed service worker files from being cached.
    # Angular >= 17 (esbuild/rolldown) names hashed files "<name>-<8 chars>.<ext>"
    # (e.g. main-V3TVDIRQ.js, chunk-DL6NzdAf.js, media/*-73PUZEUA.woff2).
    <FilesMatch "-[A-Za-z0-9_-]{8}\.(js|css|mjs|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "^(?!.*-[A-Za-z0-9_-]{8}\.(js|css|mjs)$).*\.(js|css|mjs)$">
        Header set Cache-Control "public, max-age=300, s-maxage=31536000"
    </FilesMatch>
    <FilesMatch "^(?!.*-[A-Za-z0-9_-]{8}\.woff2?$).*\.(png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$">
        Header set Cache-Control "public, max-age=300, s-maxage=31536000"
    </FilesMatch>
    <FilesMatch "^(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest|build-info\.json)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>
</VirtualHost>
